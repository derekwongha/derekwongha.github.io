<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">SilentLibrary server-rendered Django architecture</title><desc id="desc">Visitors, members and staff use Django templates. Views, URLs, authentication and permissions manage profiles, books and borrowing records through Django ORM and MySQL, with bounded media and configurable email.</desc><defs><style>.bg{fill:#fbfaf5}.col{fill:#fff;stroke:#cad6cf;stroke-width:2}.core{fill:#e8f1eb;stroke:#2e6957;stroke-width:2}.opt{fill:#fff2d8;stroke:#a7761c;stroke-width:2;stroke-dasharray:9 7}.h{font:700 25px Georgia;fill:#17231f}.b{font:600 18px Arial;fill:#263d35}.s{font:15px Arial;fill:#56645f}.arrow{stroke:#2e6957;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#a7761c;stroke-width:3;fill:none;stroke-dasharray:9 7;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#2e6957"/></marker></defs><rect class="bg" width="1440" height="820"/><text x="70" y="70" class="h" style="font-size:38px">SilentLibrary — Server-Rendered Django Architecture</text><text x="70" y="103" class="s">Foundational coursework architecture with role-aware catalogue and bounded borrowing</text>
<rect x="60" y="150" width="245" height="520" rx="22" class="col"/><text x="90" y="195" class="h">People</text><rect x="90" y="230" width="185" height="88" rx="14" class="core"/><text x="182" y="265" text-anchor="middle" class="b">Public visitor</text><text x="182" y="291" text-anchor="middle" class="s">Home · Register · Login</text><rect x="90" y="355" width="185" height="105" rx="14" class="core"/><text x="182" y="390" text-anchor="middle" class="b">Member</text><text x="182" y="416" text-anchor="middle" class="s">Search · Borrow · Return</text><text x="182" y="441" text-anchor="middle" class="s">Profile · Loan history</text><rect x="90" y="500" width="185" height="105" rx="14" class="core"/><text x="182" y="535" text-anchor="middle" class="b">Staff administrator</text><text x="182" y="561" text-anchor="middle" class="s">Catalogue CRUD</text><text x="182" y="586" text-anchor="middle" class="s">Dashboard · Loan overview</text>
