<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">HopeHands volunteer onboarding and CRM retry architecture</title>
  <desc id="desc">Public visitors, volunteers, and administrators use a React frontend and protected Django API backed by MySQL. Controlled CSV intake and HubSpot Disabled, Mock, and Live modes remain separate integration boundaries. Failed CRM synchronization can be retried manually by staff without changing approval, reviewer, or review time.</desc>
  <defs>
    <marker id="core-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#466275"/></marker>
    <marker id="optional-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b37616"/></marker>
    <style>
      .title{font:700 34px 'Segoe UI',sans-serif;fill:#173553}.subtitle{font:400 17px 'Segoe UI',sans-serif;fill:#5b6875}.heading{font:700 19px 'Segoe UI',sans-serif;fill:#173553}.body{font:400 15px 'Segoe UI',sans-serif;fill:#33495d}.small{font:600 13px 'Segoe UI',sans-serif;fill:#5b6875}.label{font:700 12px 'Segoe UI',sans-serif;fill:#5b6875;letter-spacing:1.2px}.card{fill:#fff;stroke:#bfd0d8;stroke-width:2}.role{fill:#e8f5ef;stroke:#54a88b;stroke-width:2}.optional{fill:#fff8e9;stroke:#d2a24f;stroke-width:2}.boundary{fill:#edf4fa;stroke:#6f9ebe;stroke-width:2}.success{fill:#e8f5ef;stroke:#54a88b;stroke-width:2}.failure{fill:#fff0f0;stroke:#c96b72;stroke-width:2}.core-line{stroke:#466275;stroke-width:3;fill:none;marker-end:url(#core-arrow)}.optional-line{stroke:#b37616;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#optional-arrow)}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#f7faf9"/>
  <text x="70" y="62" class="title">HopeHands — Volunteer Onboarding and CRM Recovery Architecture</text>
  <text x="70" y="92" class="subtitle">Role-protected workflow, controlled intake, persisted decisions, and staff-only CRM retry</text>

  <text x="70" y="145" class="label">PEOPLE</text>
  <rect x="70" y="170" width="210" height="92" rx="16" class="role"/>
  <text x="175" y="207" text-anchor="middle" class="heading">Public visitor</text><text x="175" y="235" text-anchor="middle" class="body">Registration</text>
  <rect x="70" y="300" width="210" height="92" rx="16" class="role"/>
  <text x="175" y="337" text-anchor="middle" class="heading">Volunteer</text><text x="175" y="365" text-anchor="middle" class="body">Own application status</text>
  <rect x="70" y="430" width="210" height="112" rx="16" class="role"/>
  <text x="175" y="469" text-anchor="middle" class="heading">Administrator</text><text x="175" y="497" text-anchor="middle" class="body">Review, reports, CSV</text><text x="175" y="521" text-anchor="middle" class="body">and staff-only CRM retry</text>

  <text x="360" y="145" class="label">CLIENT</text>
  <rect x="360" y="230" width="240" height="230" rx="18" class="card"/>
  <text x="480" y="273" text-anchor="middle" class="heading">React / Vite frontend</text>
  <text x="480" y="310" text-anchor="middle" class="body">Public registration</text><text x="480" y="338" text-anchor="middle" class="body">Shared login and profile</text><text x="480" y="366" text-anchor="middle" class="body">Admin dashboard and charts</text><text x="480" y="394" text-anchor="middle" class="body">Search and status actions</text><text x="480" y="422" text-anchor="middle" class="body">Inline CSV / CRM states</text>

  <text x="680" y="145" class="label">APPLICATION BOUNDARY</text>
  <rect x="680" y="180" width="310" height="350" rx="18" class="card"/>
  <text x="835" y="222" text-anchor="middle" class="heading">Django REST Framework API</text>
  <rect x="715" y="250" width="240" height="58" rx="12" class="boundary"/><text x="835" y="285" text-anchor="middle" class="body">JWT authentication</text>
  <rect x="715" y="325" width="240" height="58" rx="12" class="boundary"/><text x="835" y="360" text-anchor="middle" class="body">Role &amp; permission checks</text>
  <rect x="715" y="400" width="240" height="92" rx="12" class="boundary"/><text x="835" y="430" text-anchor="middle" class="body">Approval workflow</text><text x="835" y="454" text-anchor="middle" class="small">Approved state persisted first</text><text x="835" y="476" text-anchor="middle" class="small">reviewer · review time · CRM state</text>

  <text x="1070" y="145" class="label">DATA</text>
  <rect x="1070" y="190" width="250" height="92" rx="16" class="boundary"/><text x="1195" y="228" text-anchor="middle" class="heading">Django User model</text><text x="1195" y="255" text-anchor="middle" class="body">Identity and staff role</text>
  <rect x="1070" y="315" width="250" height="92" rx="16" class="boundary"/><text x="1195" y="353" text-anchor="middle" class="heading">Volunteer model</text><text x="1195" y="380" text-anchor="middle" class="body">Application and CRM state</text>
  <rect x="1070" y="440" width="250" height="84" rx="16" class="boundary"/><text x="1195" y="476" text-anchor="middle" class="heading">MySQL</text><text x="1195" y="502" text-anchor="middle" class="body">via Django ORM</text>

  <rect x="350" y="620" width="280" height="112" rx="16" class="optional"/>
  <text x="490" y="657" text-anchor="middle" class="heading">CSV validation boundary</text><text x="490" y="686" text-anchor="middle" class="body">Shared rules · row transactions</text><text x="490" y="711" text-anchor="middle" class="body">limits · safe results</text>

  <rect x="690" y="580" width="680" height="330" rx="18" class="optional"/>
  <text x="1030" y="618" text-anchor="middle" class="heading">HubSpot CRM synchronization boundary</text>
  <rect x="725" y="642" width="150" height="64" rx="12" class="role"/><text x="800" y="669" text-anchor="middle" class="body">Disabled</text><text x="800" y="691" text-anchor="middle" class="small">no network</text>
  <rect x="895" y="642" width="150" height="64" rx="12" class="role"/><text x="970" y="669" text-anchor="middle" class="body">Mock</text><text x="970" y="691" text-anchor="middle" class="small">no network</text>
  <rect x="1065" y="642" width="150" height="64" rx="12" class="optional"/><text x="1140" y="669" text-anchor="middle" class="body">Live</text><text x="1140" y="691" text-anchor="middle" class="small">optional API</text>

  <rect x="715" y="742" width="150" height="58" rx="12" class="boundary"/><text x="790" y="766" text-anchor="middle" class="body">Approval</text><text x="790" y="787" text-anchor="middle" class="small">persisted</text>
  <rect x="905" y="742" width="170" height="58" rx="12" class="boundary"/><text x="990" y="766" text-anchor="middle" class="body">CRM sync</text><text x="990" y="787" text-anchor="middle" class="small">or retry attempt</text>
  <rect x="1120" y="724" width="130" height="54" rx="12" class="success"/><text x="1185" y="757" text-anchor="middle" class="body">Synced</text>
  <rect x="1120" y="792" width="130" height="54" rx="12" class="failure"/><text x="1185" y="825" text-anchor="middle" class="body">Failed</text>
  <rect x="900" y="834" width="180" height="54" rx="12" class="optional"/><text x="990" y="856" text-anchor="middle" class="body">Staff-only Retry</text><text x="990" y="877" text-anchor="middle" class="small">CRM sync</text>

  <path d="M280 216H330Q345 216 345 246V280H360" class="core-line"/><path d="M280 346H360" class="core-line"/><path d="M280 486H330Q345 486 345 420H360" class="core-line"/>
  <path d="M600 345H680" class="core-line"/><text x="610" y="328" class="small">JSON</text>
  <path d="M990 236H1070" class="core-line"/><path d="M990 361H1070" class="core-line"/><path d="M1195 282V315" class="core-line"/><path d="M1195 407V440" class="core-line"/>
  <path d="M490 620V550Q490 530 515 530H680" class="core-line"/><text x="555" y="520" class="small">validated rows</text>
  <path d="M880 530V558Q880 570 900 580" class="optional-line"/><text x="900" y="552" class="small">optional sync after approval</text>
  <path d="M865 771H905" class="optional-line"/><path d="M1075 760H1120" class="optional-line"/><path d="M1075 784Q1095 784 1095 819H1120" class="optional-line"/>
  <path d="M1120 819H1080V861" class="optional-line"/><path d="M900 861H875Q850 861 850 820V820Q850 790 905 780" class="optional-line"/>
  <text x="1030" y="932" text-anchor="middle" class="small">Retry returns only to CRM sync — approval, reviewer, and review time remain unchanged</text>
  <text x="1030" y="954" text-anchor="middle" class="small">Already-synced records cannot retry · Approval remains recorded if CRM is unavailable</text>

  <line x1="72" y1="968" x2="112" y2="968" class="core-line"/><text x="125" y="973" class="small">Core application flow</text>
  <line x1="320" y1="968" x2="360" y2="968" class="optional-line"/><text x="373" y="973" class="small">Optional integration / safe failure / manual retry</text>
</svg>
