<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">HopeHands portfolio architecture and data flow</title><desc id="desc">Roles use a React frontend and protected Django API backed by MySQL, with controlled CSV intake and disabled, mock, or live HubSpot modes.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#466275"/></marker><marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b37616"/></marker><style>.t{font:700 34px Segoe UI,sans-serif;fill:#173553}.s{font:400 17px Segoe UI,sans-serif;fill:#5b6875}.h{font:700 19px Segoe UI,sans-serif;fill:#173553}.b{font:400 15px Segoe UI,sans-serif;fill:#33495d}.m{font:600 13px Segoe UI,sans-serif;fill:#5b6875}.x{fill:#fff;stroke:#bfd0d8;stroke-width:2}.r{fill:#e8f5ef;stroke:#54a88b;stroke-width:2}.q{fill:#fff8e9;stroke:#d2a24f;stroke-width:2}.z{fill:#edf4fa;stroke:#6f9ebe;stroke-width:2}.c{stroke:#466275;stroke-width:3;fill:none;marker-end:url(#a)}.o{stroke:#b37616;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#d)}</style></defs>
<rect width="1440" height="840" fill="#f7faf9"/><text x="70" y="62" class="t">HopeHands — Volunteer Onboarding Architecture</text><text x="70" y="92" class="s">Role-protected workflow, controlled bulk intake, reporting, and failure-aware CRM synchronization</text>
<text x="70" y="145" class="m">PEOPLE</text><rect x="70" y="170" width="210" height="92" rx="16" class="r"/><text x="175" y="207" text-anchor="middle" class="h">Public visitor</text><text x="175" y="235" text-anchor="middle" class="b">Registration</text><rect x="70" y="300" width="210" height="92" rx="16" class="r"/><text x="175" y="337" text-anchor="middle" class="h">Volunteer</text><text x="175" y="365" text-anchor="middle" class="b">Own application status</text><rect x="70" y="430" width="210" height="108" rx="16" class="r"/><text x="175" y="469" text-anchor="middle" class="h">Administrator</text><text x="175" y="497" text-anchor="middle" class="b">Review, reports</text><text x="175" y="521" text-anchor="middle" class="b">and CSV intake</text>
<text x="360" y="145" class="m">CLIENT</text><rect x="360" y="230" width="240" height="230" rx="18" class="x"/><text x="480" y="273" text-anchor="middle" class="h">React / Vite frontend</text><text x="480" y="310" text-anchor="middle" class="b">Public registration</text><text x="480" y="338" text-anchor="middle" class="b">Shared login and profile</text><text x="480" y="366" text-anchor="middle" class="b">Admin dashboard and charts</text><text x="480" y="394" text-anchor="middle" class="b">Search and status actions</text><text x="480" y="422" text-anchor="middle" class="b">Inline CSV / CRM states</text>
<text x="680" y="145" class="m">APPLICATION BOUNDARY</text><rect x="680" y="180" width="310" height="330" rx="18" class="x"/><text x="835" y="222" text-anchor="middle" class="h">Django REST Framework API</text><rect x="715" y="250" width="240" height="58" rx="12" class="z"/><text x="835" y="285" text-anchor="middle" class="b">JWT authentication</text><rect x="715" y="325" width="240" height="58" rx="12" class="z"/><text x="835" y="360" text-anchor="middle" class="b">Role &amp; permission checks</text><rect x="715" y="400" width="240" height="76" rx="12" class="z"/><text x="835" y="431" text-anchor="middle" class="b">Approval workflow</text><text x="835" y="455" text-anchor="middle" class="m">reviewer · time · CRM state</text>
<text x="1070" y="145" class="m">DATA</text><rect x="1070" y="190" width="250" height="92" rx="16" class="z"/><text x="1195" y="228" text-anchor="middle" class="h">Django User model</text><text x="1195" y="255" text-anchor="middle" class="b">Identity and staff role</text><rect x="1070" y="315" width="250" height="92" rx="16" class="z"/><text x="1195" y="353" text-anchor="middle" class="h">Volunteer model</text><text x="1195" y="380" text-anchor="middle" class="b">Application and sync state</text><rect x="1070" y="440" width="250" height="84" rx="16" class="z"/><text x="1195" y="476" text-anchor="middle" class="h">MySQL</text><text x="1195" y="502" text-anchor="middle" class="b">via Django ORM</text>
<rect x="400" y="610" width="280" height="112" rx="16" class="q"/><text x="540" y="647" text-anchor="middle" class="h">CSV validation boundary</text><text x="540" y="676" text-anchor="middle" class="b">Shared rules · row transactions</text><text x="540" y="701" text-anchor="middle" class="b">limits · safe results</text>
<rect x="790" y="580" width="520" height="170" rx="18" class="q"/><text x="1050" y="618" text-anchor="middle" class="h">HubSpot contact synchronization modes</text><rect x="820" y="642" width="135" height="66" rx="12" class="r"/><text x="887" y="670" text-anchor="middle" class="b">Disabled</text><text x="887" y="692" text-anchor="middle" class="m">no network</text><rect x="982" y="642" width="135" height="66" rx="12" class="r"/><text x="1049" y="670" text-anchor="middle" class="b">Mock</text><text x="1049" y="692" text-anchor="middle" class="m">no network</text><rect x="1144" y="642" width="135" height="66" rx="12" class="q"/><text x="1211" y="670" text-anchor="middle" class="b">Live</text><text x="1211" y="692" text-anchor="middle" class="m">optional API</text><text x="1050" y="735" text-anchor="middle" class="m">Safe failure: approval remains recorded; bounded state is returned</text>
